<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e4ebf4">
<title>Posada 2026 | Máxima · Cargo Monterrey</title>
<style>
:root{--fondo:#e4ebf4;--azul:#173b8b;--azul2:#244db1}
*{box-sizing:border-box}
html{background:var(--fondo);scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--azul);font-family:Georgia,'Times New Roman',serif}
main{width:100%;max-width:760px;margin:0 auto;padding:10px}
.page{margin:0 auto 18px;max-width:620px}
.page img{display:block;width:100%;height:auto}
.map-link{display:block;text-align:center;padding:18px;color:var(--azul)}
.rsvp{margin:24px auto 42px;max-width:620px;padding:28px 22px;background:#f8faff;border:2px solid var(--azul);outline:1px solid #7890bd;outline-offset:5px;text-align:center}
.rsvp h2{font-family:'Brush Script MT','Segoe Script',cursive;font-size:42px;font-weight:400;margin:0 0 10px}
.rsvp p{line-height:1.5}
form{text-align:left;display:grid;gap:12px;max-width:430px;margin:20px auto 0}
label,legend{font-size:14px}
input[type=text]{width:100%;padding:13px;border:1px solid #9aaccb;background:white;color:var(--azul);font:16px Georgia,serif}
fieldset{border:0;padding:4px 0;margin:0;display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:8px}
button{cursor:pointer;font:inherit}
.submit{padding:13px;background:var(--azul);color:white;border:0}
#formMsg{text-align:center;font-size:13px;min-height:20px}
footer{text-align:center;padding:20px;font-size:11px;letter-spacing:2px}
/* Sobre de bienvenida: el contenido de la invitación permanece visible incluso sin JavaScript */
.cover{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,#f8fbff,#dce6f2);transition:opacity .8s ease,visibility .8s ease}
.cover.hide{opacity:0;visibility:hidden;pointer-events:none}
.cover-inner{width:min(100%,380px);text-align:center}
.envelope{position:relative;width:min(78vw,320px);height:205px;margin:0 auto 22px;filter:drop-shadow(0 12px 16px #173b8b30)}
.env-back{position:absolute;inset:0;background:#cbd9ea;border:2px solid var(--azul);border-radius:7px}
.env-letter{position:absolute;z-index:2;left:8%;right:8%;bottom:5%;height:82%;background:#fffdf8;border:1px solid #a9bad4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;transition:transform .8s .2s}
.env-letter strong{font-family:'Brush Script MT','Segoe Script',cursive;font-size:42px;font-weight:400}
.env-letter small{font-size:10px;letter-spacing:3px;text-transform:uppercase}
.env-front{position:absolute;inset:0;z-index:4;background:#d5e1ef;border:2px solid var(--azul);border-radius:7px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;inset:0;z-index:5;background:#eaf0f7;clip-path:polygon(0 0,100% 0,50% 65%);transform-origin:top;transition:transform .8s}
.seal{position:absolute;z-index:6;left:50%;top:56%;transform:translate(-50%,-50%);width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--azul);color:white;border:2px solid white}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
.envelope.open .env-letter{transform:translateY(-70%)}
.envelope.open .seal{opacity:0}
.hint{font-family:'Brush Script MT','Segoe Script',cursive;font-size:27px;margin:0 0 16px}
.open-btn{background:var(--azul);color:white;border:1px solid var(--azul);padding:13px 25px;border-radius:3px}
.snow{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden;display:none}
.snow.active{display:block}
.flake{position:absolute;top:-25px;color:white;text-shadow:0 0 5px #8299bd;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(360deg)}}
.reveal{animation:fadeUp .9s both}
@keyframes fadeUp{from{opacity:.25;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
